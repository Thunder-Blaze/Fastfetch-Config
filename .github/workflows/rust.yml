name: Rust

on:
  push:
    branches: [ "critical" ]
  pull_request:
    branches: [ "critical" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
      working-directory: tsukiyomi-fetch-rust
    - name: Run tests
      run: cargo test --verbose
      working-directory: tsukiyomi-fetch-rust
